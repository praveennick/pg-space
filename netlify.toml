[build]
command = "npm run build:firebase"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["firebase-admin"]

[[redirects]]
from = "/api/tenant-login"
to = "/.netlify/functions/tenant-login"
status = 200
force = true

[[redirects]]
from = "/api/account-action"
to = "/.netlify/functions/account-action"
status = 200
force = true

[[redirects]]
from = "/api/account-email"
to = "/.netlify/functions/account-email"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
